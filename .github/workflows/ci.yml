name: OCPNG Release 1 CI

on:
  push:
    branches: ['feat/wasdok360-release1', 'main']
  pull_request:
    branches: ['feat/wasdok360-release1', 'main']

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run test:run
      - name: Authentication security regressions (WASDOK-62)
        run: npm run test:auth-security
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - run: supabase db reset
      - run: npm run test:rls
      - name: Backup & Recovery end-to-end (WASDOK-55)
        run: |
          eval "$(supabase status -o env)"
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          export WASDOK55_BACKUP_E2E="true"
          npx vitest run tests/backups/e2e.test.ts
      - name: System Health end-to-end (WASDOK-85)
        run: |
          eval "$(supabase status -o env)"
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          export WASDOK85_HEALTH_E2E="true"
          npx vitest run tests/health/e2e.test.ts
      - name: Reset local database after WASDOK-55/WASDOK-85 E2E
        run: supabase db reset
      - name: Complaint intake end-to-end and audit (WASDOK-67)
        run: |
          eval "$(supabase status -o env)"
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          export OCPNG_COMPLAINT_SUBMISSION_ENABLED="true"
          export WASDOK67_COMPLAINT_E2E="true"
          npx vitest run tests/complaints/intake-e2e.test.ts
      - name: Access Control end-to-end (WASDOK-78)
        run: |
          eval "$(supabase status -o env)"
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          export WASDOK78_ACCESS_E2E="true"
          npx vitest run tests/access-control/e2e.test.ts
      - name: Reset local database for Task 10 concurrency isolation
        run: supabase db reset
      - name: Access Control last-admin concurrency (WASDOK-78 Task 10)
        run: |
          eval "$(supabase status -o env)"
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          export WASDOK78_ACCESS_E2E="true"
          npx vitest run tests/access-control/task10-concurrency-e2e.test.ts
      - run: npm run typecheck:domain
      - run: npm run test:domain
      - run: npm run test:schema
      - run: npm run test:routes
      - run: npm run verify:static
      - run: npm run typecheck
      - run: npm run lint
      - name: Production build, browser credential scan and HTTP authentication boundary (WASDOK-62)
        run: npm run test:auth-build
