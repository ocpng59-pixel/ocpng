name: OCPNG Release 1 CI

on:
  push:
    branches: ['feat/wasdok360-release1', 'main']
  pull_request:
    branches: ['feat/wasdok360-release1', 'main']

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run test:run
      - name: Authentication security regressions (WASDOK-62)
        run: npm run test:auth-security
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - run: supabase db reset
      - run: npm run test:rls
      - name: Complaint intake end-to-end and audit (WASDOK-67)
        run: |
          eval "$(supabase status -o env)"
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          export OCPNG_COMPLAINT_SUBMISSION_ENABLED="true"
          export WASDOK67_COMPLAINT_E2E="true"
          npx vitest run tests/complaints/intake-e2e.test.ts
      - run: npm run typecheck:domain
      - run: npm run test:domain
      - run: npm run test:schema
      - run: npm run test:routes
      - run: npm run verify:static
      - run: npm run typecheck
      - run: npm run lint
      - name: Production build, browser credential scan and HTTP authentication boundary (WASDOK-62)
        run: npm run test:auth-build
